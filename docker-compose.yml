services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/app
      READONLY_DATABASE_URL: postgresql://readonly_app:readonly@db:5432/app
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      APP_RATE_LIMIT_PER_MIN: ${APP_RATE_LIMIT_PER_MIN:-30}
    ports:
      - "8000:8000"

volumes:
  pgdata:
