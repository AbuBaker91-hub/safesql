[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safesql"
version = "0.1.0"
description = "Chat-to-SQL with read-only guardrails: the model proposes, the database disposes. Includes an MCP server for Claude."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AbuBaker" }]
dependencies = [
    "aiforge-core @ git+https://github.com/AbuBaker91-hub/aiforge-core@v0.1.0",
    "sqlglot>=25.0",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
